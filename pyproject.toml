[project]
name = "container-vuln-attribution"
version = "0.1.0"
description = "Inventory Kubernetes images, scan each digest once with Trivy, attribute findings to owners and rank them."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["cva"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
